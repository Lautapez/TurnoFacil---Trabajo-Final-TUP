spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/turnofacil}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# JWT: el secreto es OBLIGATORIO y solo se lee de la variable de entorno JWT_SECRET
# (minimo 32 caracteres). Si no esta definida, la aplicacion no arranca.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Administrador inicial (opcional). Si ambas variables estan definidas y el email
# no existe, se crea un usuario con rol ADMINISTRADOR al arrancar.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
